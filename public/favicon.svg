<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#0C0C10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B3D"/>
      <stop offset="100%" style="stop-color:#FF4A1C"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Orange accent arc (top-right corner) -->
  <circle cx="32" cy="0" r="14" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.35"/>

  <!-- C letterform -->
  <text
    x="16"
    y="22.5"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="20"
    fill="white"
    letter-spacing="-0.5"
  >C</text>

  <!-- Orange dot bottom-right (brand accent) -->
  <circle cx="24" cy="24" r="2.5" fill="url(#accent)"/>
</svg>
